<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schema Generator v6</title>
<style>
:root{--bg:#f4f7f5;--cd:#fff;--bd:#d5ddd8;--tx:#1a3a3a;--mt:#6b8a7a;--pr:#2d6a5c;--pl:#e8f0ec;
  --ac:#d4956a;--dg:#c0392b;--ok:#27ae60;--pu:#7c5cbf;--ft:'Segoe UI',system-ui,sans-serif;--mn:'Cascadia Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ft);background:var(--bg);color:var(--tx);font-size:11px;line-height:1.35}
.app{max-width:1560px;margin:0 auto;padding:12px}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hdr h1{font-size:16px;font-weight:700;color:var(--pr)}
.hdr .tag{font-size:8px;padding:1px 5px;background:var(--pl);color:var(--pr);border-radius:4px;font-weight:700}
.hdr .sub{font-size:9px;color:var(--mt)}
.hdr .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{padding:6px 14px;font-size:11px;font-weight:700;border:none;border-radius:5px;cursor:pointer}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-g{background:var(--pr);color:#fff}.btn-g:hover{background:#245a4e}
.btn-d{background:var(--ok);color:#fff}.btn-d:hover{background:#219a52}
.btn-s{background:var(--pl);color:var(--pr);padding:5px 9px}.btn-s:hover{background:#d9e6df}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.params{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
@media(max-width:1200px){.params{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.params{grid-template-columns:1fr}}
.p{background:var(--cd);border:1px solid var(--bd);border-radius:7px;padding:8px 10px}
.p h3{font-size:10px;font-weight:700;color:var(--pr);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--pl)}
.f{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:4px}
.f label{font-size:10px;white-space:nowrap;flex-shrink:0}
.f .v{font-family:var(--mn);font-size:9px;color:var(--pr);font-weight:700;min-width:30px;text-align:right}
.f input[type=range]{flex:1;height:3px;-webkit-appearance:none;background:var(--bd);border-radius:2px;min-width:50px}
.f input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--pr);cursor:pointer}
.f select,.f input[type=text],.f input[type=number]{flex:1;padding:2px 4px;font-size:9px;border:1px solid var(--bd);border-radius:4px;min-width:0;font-family:var(--ft)}
.f .pfx{max-width:70px}
.tw{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.tw label{font-size:9px;flex:1}
.sw{position:relative;width:24px;height:13px;cursor:pointer;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw .s{position:absolute;inset:0;background:var(--bd);border-radius:7px;transition:.2s}
.sw .s:before{content:'';position:absolute;width:7px;height:7px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+.s{background:var(--pr)}
.sw input:checked+.s:before{transform:translateX(11px)}
.sw input:focus-visible+.s{outline:2px solid var(--ac)}
.out{background:var(--cd);border:1px solid var(--bd);border-radius:7px;padding:10px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px;margin-bottom:8px}
.sc{padding:5px;background:var(--pl);border-radius:4px;text-align:center}
.sc .n{font-size:15px;font-weight:800;color:var(--pr);font-family:var(--mn)}
.sc .l{font-size:8px;color:var(--mt)}
.wn{padding:3px 6px;margin-bottom:2px;border-radius:3px;font-size:9px}
.wn.e{background:#fde8e8;color:var(--dg)}.wn.i{background:var(--pl);color:var(--pr)}.wn.w{background:#fff3e6;color:#9a5a1e}
.tb{display:flex;border-bottom:2px solid var(--bd);margin-bottom:6px;flex-wrap:wrap}
.tb button{padding:3px 10px;font-size:9px;font-weight:600;border:none;background:none;cursor:pointer;color:var(--mt);border-bottom:2px solid transparent;margin-bottom:-2px}
.tb button.on{color:var(--pr);border-bottom-color:var(--pr)}
.pre{background:#1a2a2a;color:#a8d8b8;padding:8px;border-radius:5px;font-family:var(--mn);font-size:8px;line-height:1.3;max-height:400px;overflow:auto;white-space:pre;tab-size:6}
table.dt{width:100%;border-collapse:collapse;font-size:9px}
table.dt th{text-align:left;padding:2px 4px;background:var(--pl);color:var(--pr);font-weight:600;position:sticky;top:0}
table.dt td{padding:2px 4px;border-bottom:1px solid var(--bd)}
.th{max-height:380px;overflow:auto}
.lg{font-size:8px;color:var(--mt);max-height:380px;overflow:auto;font-family:var(--mn)}
.lg div{padding:1px 0}.lg .ok::before{content:'✓ ';color:var(--ok)}.lg .wr::before{content:'⚠ ';color:var(--ac)}.lg .er::before{content:'✗ ';color:var(--dg)}
.mt0{text-align:center;padding:30px;color:var(--mt)}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-bottom:8px}
.chk div{padding:6px 8px;border-radius:4px;background:var(--pl);font-size:9px}
.chk b{font-family:var(--mn);font-size:13px;display:block}
.chk .bad{background:#fde8e8;color:var(--dg)}.chk .good{color:var(--ok)}
.cal{font-family:var(--mn);font-size:9px;line-height:1.5;white-space:pre-wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <h1>Schema Generator</h1><span class="tag">v6</span>
  <span class="sub">Läsårsmodell · tjänstefördelning · resurs &amp; samundervisning · namnprofiler · CP1252</span>
  <div class="acts">
    <button class="btn btn-s" onclick="rollNames()" title="Slumpa skolnamn och kommun">Nytt namn</button>
    <button class="btn btn-s" onclick="rollSeed()" title="Slumpa seed">Ny seed</button>
    <button class="btn btn-g" onclick="runUI()">Generera</button>
    <button class="btn btn-d" id="bD" onclick="dl()" disabled>Ladda ner</button>
  </div>
</div>
<div class="params" id="params"></div>
<div class="out">
  <div id="mt" class="mt0"><p style="font-size:24px">📅</p><p>Ställ in parametrar → <b>Generera</b></p>
  <p style="font-size:9px;margin-top:4px">Allt innehåll är fiktivt. Ortnamn, skolnamn, signaturer och kalender genereras från seed.</p></div>
  <div id="rs" style="display:none">
    <div class="sg" id="sG"></div><div id="wG"></div>
    <div class="tb" id="tB"></div><div id="tC"></div>
  </div>
</div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════
// 0. RNG & small utilities
// ═══════════════════════════════════════════════════════════════
let R=Math.random;
function seed(s){let a=(s|0)||1;R=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rn=()=>R(),ri=(a,b)=>Math.floor(rn()*(b-a+1))+a,pk=a=>a[Math.floor(rn()*a.length)],chance=p=>rn()<p;
const sh=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(rn()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
const r5=m=>Math.round(m/5)*5,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
function uid(){const h='0123456789ABCDEF';let s='';for(let i=0;i<32;i++){s+=i===12?'4':i===16?pk(['8','9','A','B']):h[Math.floor(rn()*16)];if([7,11,15,19].includes(i))s+='-'}return s}
function wpick(items){let t=0;for(const[,w]of items)t+=w;let x=rn()*t;for(const[it,w]of items){x-=w;if(x<=0)return it}return items[items.length-1][0]}
const ascii=s=>s.replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[ÅÄ]/g,'A').replace(/Ö/g,'O').replace(/é/g,'e').replace(/ü/g,'u').replace(/[^A-Za-z0-9.\-]/g,'');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const DAYS=['Måndag','Tisdag','Onsdag','Torsdag','Fredag'];

// ═══════════════════════════════════════════════════════════════
// 1. Encoding — Novaschem text files are ANSI (Windows-1252), CRLF
// ═══════════════════════════════════════════════════════════════
const CP1252_HI={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function encodeCP1252(s){const out=new Uint8Array(s.length);let n=0;for(const ch of s){const c=ch.codePointAt(0);out[n++]=(c<0x80||(c>=0xA0&&c<=0xFF))?c:(CP1252_HI[c]!==undefined?CP1252_HI[c]:0x3F)}return out.subarray(0,n)}
function encodeUTF8(s){return new TextEncoder().encode(s)}

// ═══════════════════════════════════════════════════════════════
// 2. Calendar — a läsår is built from dates, never from a fixed week string
// ═══════════════════════════════════════════════════════════════
const DAYMS=86400000,D=(y,m,d)=>new Date(Date.UTC(y,m-1,d)),addD=(d,n)=>new Date(d.getTime()+n*DAYMS),dow=d=>d.getUTCDay()||7;
function isoWeek(d){const t=new Date(d.getTime());t.setUTCDate(t.getUTCDate()+4-dow(t));const y0=Date.UTC(t.getUTCFullYear(),0,1);return{week:Math.ceil(((t.getTime()-y0)/DAYMS+1)/7),year:t.getUTCFullYear()}}
function mondayOf(year,week){const j4=D(year,1,4);return addD(addD(j4,-(dow(j4)-1)),(week-1)*7)}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return D(y,Math.floor((h+l-7*m+114)/31),((h+l-7*m+114)%31)+1)}
const dm=d=>`${d.getUTCDate()}/${d.getUTCMonth()+1}`,isoD=d=>d.toISOString().slice(0,10);
const SPORTLOV={vast:7,syd:8,ost:9,norr:10};

function buildCalendar(P){
  const Y=+P.year,start=addD(mondayOf(Y,+P.startWeek),+P.startDow-1),end=addD(mondayOf(Y+1,+P.endWeek),+P.endDow-1);
  const w51f=addD(mondayOf(Y,51),4),w52m=mondayOf(Y,52);
  const julEnd=pk([w51f,w51f,w52m,addD(w52m,1),addD(w52m,2)]);
  const w2m=mondayOf(Y+1,2);const vtStart=pk([w2m,addD(w2m,1),addD(w2m,2),addD(w2m,3),mondayOf(Y+1,3)]);
  const sportW=SPORTLOV[P.region]||9,eas=easter(Y+1),easW=isoWeek(eas).week,paskW=P.paskBefore?easW:easW+1;
  const hol=new Set([isoD(D(Y+1,1,6)),isoD(D(Y+1,5,1)),isoD(D(Y+1,6,6)),isoD(addD(eas,-2)),isoD(addD(eas,1))]);
  const asc=addD(eas,39);hol.add(isoD(asc));if(chance(.7))hol.add(isoD(addD(asc,1)));
  const days=[];
  for(let d=start;d<=end;d=addD(d,1)){if(dow(d)>5)continue;const w=isoWeek(d);
    if(d>julEnd&&d<vtStart)continue;if(w.year===Y&&w.week===44)continue;if(w.year===Y+1&&(w.week===sportW||w.week===paskW))continue;
    if(hol.has(isoD(d)))continue;days.push(d)}
  const cand=days.filter((d,i)=>i>5&&i<days.length-5&&(dow(d)===1||dow(d)===5));
  const stud=sh(cand).slice(0,+P.studiedagar),sset=new Set(stud.map(isoD));
  const school=days.filter(d=>!sset.has(isoD(d)));
  const segs=[];let cur=null;
  for(const d of school){const w=isoWeek(d),key=w.year+'-'+w.week;if(!cur||cur.key!==key){cur={key,week:w.week,year:w.year,days:[]};segs.push(cur)}cur.days.push(d)}
  segs.forEach(s=>{s.first=s.days[0];s.last=s.days[s.days.length-1];s.str=s.days.length>1?`${dm(s.first)}-${dm(s.last)}`:dm(s.first);s.ht=s.first.getUTCFullYear()===Y});
  return{Y,start,end,julEnd,vtStart,segs,school,studiedagar:stud,sportW,paskW,weeks:segs.map(s=>s.week),label:`${Y}/${String(Y+1).slice(2)}`};
}
function buildPeriods(P,cal){
  const htS=cal.segs.filter(s=>s.ht),vtS=cal.segs.filter(s=>!s.ht);
  let ht=htS,vt=vtS;
  if(P.dq>=1&&chance(.3))ht=htS.slice(0,htS.length-ri(1,2));
  if(P.dq>=1&&chance(.2))vt=vtS.slice(1);
  const per={HT:{segs:ht},VT:{segs:vt}};
  if(P.perUV){per.UV={segs:cal.segs.filter(s=>s.week%2===1)};per.JV={segs:cal.segs.filter(s=>s.week%2===0)}}
  if(P.perP4){for(let k=0;k<4;k++)per['P'+(k+1)]={segs:cal.segs.filter((s,i)=>i%4===k)}}
  Object.values(per).forEach(p=>{p.weeks=p.segs.map(s=>s.week);p.cal=p.segs.map(s=>s.str).join(', ')});
  return per;
}
function parseWeeks(str){const out=[];String(str||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const m=x.match(/^(\d+)-(\d+)$/);if(m){for(let w=+m[1];w<=+m[2];w++)out.push(w)}else if(/^\d+$/.test(x))out.push(+x)});return out}
function compressWeeks(ws){const o=[];let i=0;while(i<ws.length){let j=i;while(j+1<ws.length&&ws[j+1]===ws[j]+1)j++;o.push(j>i?`${ws[i]}-${ws[j]}`:String(ws[i]));i=j+1}return o.join(', ')}

// ═══════════════════════════════════════════════════════════════
// 3. Names — generic pools; fictional places built from nature compounds.
// ═══════════════════════════════════════════════════════════════
const FN_F=['Anna','Maria','Karin','Eva','Sara','Lena','Helena','Ingrid','Sofia','Emma','Katarina','Malin','Therese','Camilla','Jenny','Kristina','Pernilla','Ulrika','Åsa','Diana','Fatima','Irina','Leyla','Nadia','Petra','Linnea','Elin','Hanna','Ida','Johanna','Josefin','Julia','Klara','Lisa','Lovisa','Matilda','Moa','Nathalie','Rebecka','Sanna','Stina','Tove','Wilma','Alva','Agnes','Amina','Aisha','Zahra','Yasmin','Mariam','Noor','Dalia','Selma','Elsa','Astrid','Signe','Märta','Gunilla','Monica','Birgitta','Marianne','Annika','Cecilia','Charlotta','Jessica','Madeleine','Susanne','Veronica','Carina','Mona','Ebba','Freja','Saga','Tilda','Nova'];
const FN_M=['Erik','Lars','Johan','Anders','Magnus','Mikael','Fredrik','Peter','Gustav','Nils','Henrik','Olof','Björn','Daniel','Karl','Martin','Rasmus','Viktor','Christian','Elias','Hassan','Jamal','Mohammad','Omar','Tobias','Oskar','Simon','Jonas','Andreas','Niklas','Patrik','Stefan','Thomas','Mattias','Marcus','Joakim','Jakob','Emil','Hugo','Axel','Albin','Arvid','Filip','Isak','Leo','Liam','Noah','Oliver','William','Adam','Ali','Ahmed','Yusuf','Ibrahim','Samir','Tariq','Amir','Kemal','Dejan','Marko','Tomasz','Piotr','Juho','Mikko','Sven','Bengt','Göran','Håkan','Kjell','Rolf','Torbjörn','Ulf','Jan','Per','Bo','Hans','Leif'];
const LN=['Andersson','Johansson','Karlsson','Nilsson','Eriksson','Larsson','Olsson','Persson','Svensson','Gustafsson','Pettersson','Jonsson','Jansson','Hansson','Bengtsson','Jönsson','Lindberg','Magnusson','Olofsson','Lindström','Lindqvist','Lindgren','Berg','Bergström','Lundberg','Lundgren','Lund','Mattsson','Berglund','Fredriksson','Sandberg','Henriksson','Forsberg','Sjöberg','Wallin','Engström','Eklund','Danielsson','Håkansson','Lundin','Björk','Bergman','Nyström','Holm','Samuelsson','Fransson','Wikström','Isaksson','Arvidsson','Nyberg','Blom','Ekström','Åberg','Strömberg','Hedlund','Sundberg','Sjögren','Ek','Blomqvist','Abrahamsson','Martinsson','Öberg','Andreasson','Strand','Åkesson','Norberg','Lindholm','Månsson','Hellström','Dahl','Falk','Ahmed','Ali','Hassan','Mohamed','Hussein','Ibrahim','Khalil','Osman','Yusuf','Nguyen','Kowalski','Nowak','Petrov','Jovanović','Hadžić','Virtanen','Korhonen','Nurmi','Haddad','Karimi','Rezai','Said','Omar','Mahmoud','Lindahl','Sandström','Söderberg','Nordström','Hagström','Vikander','Rosén','Boström','Hultgren','Åström','Vestlund','Brännström','Törnqvist','Edlund','Grönberg'];
const STEM=['Ek','Björk','Tall','Gran','Alm','Lind','Hassel','Rönn','Asp','Furu','Vide','Lönn','Hägg','Sten','Sjö','Äng','Dal','Kärr','Mo','Hed','Lund','Ås','Berg','Skog','Ljung','Mossa','Säv','Vass','Näckros','Enebärs','Oxel','Pil','Sälg','Humle','Klöver','Timotej','Rapp','Tranbärs','Lingon','Hallon','Blåbärs','Nypon','Fläder','Syren','Måne','Sol','Stjärn','Regn','Vind','Snö'];
const SUFFIX=['backen','liden','dalen','ängen','viken','udden','hagen','lunden','berga','torp','hult','holmen','gärdet','slätten','höjden','kullen','myren','stranden','bron','vallen','åsen','mon','hyttan','kärret','ängarna'];
const KOMMUN_SUFFIX=['vik','stad','by','berga','sund','hamn','sjö','ryd','tuna','dal','fors'];
function fictionalPlace(){return pk(STEM)+pk(SUFFIX)}
function fictionalSchool(){const st=fictionalPlace();return chance(.5)?`${st}s skola`:(st.endsWith('a')?`${st}skolan`:`${st}skolan`)}
function fictionalKommun(){let k='';for(let i=0;i<20;i++){k=pk(STEM)+pk(KOMMUN_SUFFIX);if(!/s$/i.test(k))break}return`${k}s kommun`}

// Signatures: real schedules use short codes; anonymised ones use Initial+Surname
const SIG_STYLES={abc:'Abc (3 bokstäver)',ABC:'ABC (versaler)',init:'ESvensson (initial+efternamn)',first:'EvaS (förnamn+initial)',mixed:'Blandat'};
function makeSig(first,last,style,used){
  const f=ascii(first),l=ascii(last.replace(/-.*$/,''));const F=f.toUpperCase(),L=l.toUpperCase();
  let c=[];
  if(style==='mixed')style=pk(['abc','abc','ABC','init','first']);
  if(style==='abc'||style==='ABC'){c=[f[0]+l.slice(0,2),f[0]+l[0]+(l[2]||'x'),f.slice(0,2)+l[0],f[0]+l[1]+(l[2]||'x'),f[0]+l[0]+l[l.length-1],f.slice(0,2)+l.slice(0,2),f[0]+l.slice(0,3)]}
  else if(style==='init'){c=[first[0]+last,first.slice(0,2)+last]}
  else{c=[first+last[0],first+last.slice(0,2),first.toLowerCase()+last[0].toLowerCase()]}
  const norm=s=>style==='ABC'?s.toUpperCase():style==='abc'?s[0].toUpperCase()+s.slice(1).toLowerCase():s;
  for(const x of c){const n=norm(x);const k=n.toLowerCase();if(!used.has(k)){used.add(k);return n}}
  for(let i=2;i<20;i++){const n=norm(c[0])+i;const k=n.toLowerCase();if(!used.has(k)){used.add(k);return n}}
  return norm(c[0])+ri(100,999);
}

// ═══════════════════════════════════════════════════════════════
// 4. Subjects — minutes/week per stage (timplan-shaped), naming profiles
// ═══════════════════════════════════════════════════════════════
const SUBJ={
  fsk:{short:'Fsk',off:'FSK',long:'Förskoleklass',len:'fsk',cat:'core'},
  sv:{short:'Sv',off:'SV',long:'Svenska',len:'core',cat:'core',tp:{lag:380,mel:290,hog:165}},
  sva:{short:'SvA',off:'SVA',long:'Svenska som andraspråk',len:'core',cat:'core'},
  ma:{short:'Ma',off:'MA',long:'Matematik',len:'core',cat:'core',tp:{lag:235,mel:230,hog:225}},
  en:{short:'En',off:'EN',long:'Engelska',len:'core',cat:'core',tp:{lag:35,mel:125,hog:115}},
  idh:{short:'Idh',off:'IDH',long:'Idrott och hälsa',len:'idh',cat:'prac',rm:'gym',tp:{lag:80,mel:90,hog:170}},

  const cStats={};classes.forEach(c=>{const mine=les.filter(l=>l.kind==='lesson'&&l.cls.includes(c.id));const slots=new Map();mine.forEach(l=>slots.set(l.day+'|'+l.start,l.len));cStats[c.name]={n:slots.size,mins:[...slots.values()].reduce((s,x)=>s+x,0),teachers:new Set(mine.flatMap(l=>l.teachers)).size,rooms:new Set(mine.map(l=>l.room)).size,mentors:c.mentors.join(','),sva:c.sva,co:c.co,home:c.home||''}});
  const fname=`${ascii(schoolName).replace(/\s+/g,'_')}_${cal.label.replace('/','-')}.${P.fm==='n'?'TXT':'csv'}`;
  return{P,failedRows,text,clean,bytes,fname,les,staff,classes,groups,subjects,rooms,roomType,cal,per,ta,tStats,cStats,checks,log,noise,placed,failed,schoolName,kommun,damage};
}

function buildUI(){const host=document.getElementById('params');if(!host)return;host.innerHTML=UI.map(([title,fs])=>`<div class="p"><h3>${title}</h3>${fs.map(f=>{const id='p_'+f.k,v=DEF[f.k];
  if(f.t==='rng')return`<div class="f"><label for="${id}">${f.l}</label><input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.step||1}" value="${v}"><span class="v" id="o_${f.k}">${T_IDS.has(f.k)?hm(v):v}</span></div>`;
  if(f.t==='sel')return`<div class="f"><label for="${id}">${f.l}</label><select id="${id}">${f.o.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${val}"${String(val)===String(v)?' selected':''}>${lab}</option>`}).join('')}</select></div>`;
  if(f.t==='chk')return`<div class="tw"><label for="${id}">${f.l}</label><span class="sw"><input type="checkbox" id="${id}"${v?' checked':''}><span class="s"></span></span></div>`;
  return`<div class="f"><label for="${id}">${f.l}</label><input type="text" id="${id}" value="${v}" placeholder="${f.ph||''}"></div>`}).join('')}</div>`).join('');
  UI.forEach(([,fs])=>fs.forEach(f=>{if(f.t!=='rng')return;const s=document.getElementById('p_'+f.k),o=document.getElementById('o_'+f.k);s.addEventListener('input',()=>o.textContent=T_IDS.has(f.k)?hm(+s.value):s.value)}))}
function collectParams(){const P={};Object.keys(DEF).forEach(k=>{const el=document.getElementById('p_'+k);if(!el){P[k]=DEF[k];return}P[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value});return P}
function rollSeed(){const s=document.getElementById('p_sd');if(!s)return;s.value=ri(1,9999);document.getElementById('o_sd').textContent=s.value}
function rollNames(){seed(Date.now()%100000);document.getElementById('p_nm').value=fictionalSchool();document.getElementById('p_kommun').value=fictionalKommun()}
let GEN=null,activeTab='preview';
function runUI(){const P=collectParams();if(P.autoSeed){R=Math.random;rollSeed();P.sd=+document.getElementById('p_sd').value}
  const t0=performance.now();GEN=generate(P);GEN.ms=Math.round(performance.now()-t0);render()}
function render(){const G=GEN;if(!G)return;document.getElementById('mt').style.display='none';document.getElementById('rs').style.display='';document.getElementById('bD').disabled=false;
  const teach=G.les.filter(l=>l.kind==='lesson'),tv=Object.values(G.tStats).filter(t=>t.role==='teacher'&&!t.leave&&!t.archived&&!t.vik);
  const avg=tv.length?Math.round(tv.reduce((s,t)=>s+t.hrs,0)/tv.length*10)/10:0;const cv=Object.values(G.cStats);
  const cards=[[G.les.length,'rader totalt'],[teach.length,'lektioner'],[G.ta.length,'TA-rader'],[tv.length,'lärare'],[G.classes.length,'klasser'],[G.groups.size,'grupper'],[G.rooms.length,'salar'],[avg+'h','snitt undervisning'],[Math.min(...cv.map(c=>c.teachers))+'–'+Math.max(...cv.map(c=>c.teachers)),'lärare/klass'],[G.les.filter(l=>l.kind==='resurs').length,'resurspass'],[G.les.filter(l=>l.kind==='lesson'&&l.teachers.length>1).length,'tvålärarpass'],[G.noise,'brus'],[Math.round(G.bytes.length/1024)+' KB','fil'],[G.ms+' ms','tid']];
  document.getElementById('sG').innerHTML=cards.map(([n,l])=>`<div class="sc"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const W=[];if(G.failed)W.push({t:G.failed>G.placed*.05?'e':'w',m:`${G.failed} lektionspass kunde inte placeras — öka klassrum/bemanning eller förläng skoldagen`});
  const nC=G.checks.teacher+G.checks.class+G.checks.room;if(+G.P.dq===0&&nC)W.push({t:'e',m:`Perfekt-läge men ${nC} konflikter`});

function renderTab(){const G=GEN,el=document.getElementById('tC');if(!G)return;const tbl=(h,rows)=>`<div class="th"><table class="dt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  else if(activeTab==='checks'){const c=G.checks;const cell=(n,l)=>`<div class="${n?'bad':'good'}"><b>${n}</b>${l}</div>`;el.innerHTML=`<div class="chk">${cell(c.teacher,'lärarkonflikter')}${cell(c.class,'klasskonflikter')}${cell(c.room,'salskonflikter')}${cell(G.failed,'oplacerade pass')}</div><div class="lg">${c.examples.map(x=>`<div class="wr">${esc(x)}</div>`).join('')||'<div class="ok">Inga konflikter i lektioner, lunch, mentorstid, personalposter eller salar.</div>'}</div>`}

  else if(activeTab==='classes'){el.innerHTML=tbl(['Klass','Lektioner','Min/vecka','Lärare','Salar','Mentorer','Hemsal','SvA','Tvålärare'],Object.entries(G.cStats).map(([c,s])=>[`<b>${esc(c)}</b>`,s.n,s.mins,s.teachers,s.rooms,s.mentors,s.home,s.sva?'✓':'',s.co?'✓':'']))}
  else if(activeTab==='groups'){el.innerHTML=tbl(['Grupp','Klass','Lärare','IClass'],[...G.groups.values()].map(g=>[esc(g.name),g.isClass?1:0,g.teachers.join(','),g.iclass.join(',')]))}
  else if(activeTab==='rooms'){const u={};G.les.filter(l=>l.room&&l.kind==='lesson').forEach(l=>u[l.room]=(u[l.room]||0)+1);el.innerHTML=tbl(['Sal','Typ','Lektioner/vecka'],G.rooms.map(r=>[r,G.roomType[r],u[r]||0]))}
  else if(activeTab==='calendar'){el.innerHTML=`<div class="cal">Läsår ${G.cal.label}: ${isoD(G.cal.start)} – ${isoD(G.cal.end)}\nSkolveckor: ${compressWeeks(G.cal.weeks)}\nStudiedagar: ${G.cal.studiedagar.map(d=>isoD(d)).join(', ')||'–'}\n\n${Object.entries(G.per).map(([k,p])=>`${k}: ${compressWeeks(p.weeks)}`).join('\n')}\n\nSchoolYear: ${G.cal.segs.map(s=>s.str).join(', ')}</div>`}
  else if(activeTab==='log'){el.innerHTML=`<div class="lg">${G.log.map(e=>`<div class="${e.t}">${esc(e.m)}</div>`).join('')}</div>`}}
function saveBytes(bytes,fname){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function dl(){if(!GEN)return;const P=collectParams();const n=+P.batch||1;
  if(n<=1){saveBytes(GEN.bytes,GEN.fname);return}
  R=Math.random;const kom=(P.kommun||'').trim()||fictionalKommun();
  for(let i=0;i<n;i++){const Q=Object.assign({},P,{sd:ri(1,9999),nm:'',kommun:kom});if(i>0){Q.cy=clamp(+P.cy+ri(-1,1),1,6)}
    const G=generate(Q);saveBytes(G.bytes,G.fname);await new Promise(r=>setTimeout(r,600))}}
if(typeof document!=='undefined'&&document.getElementById('params'))buildUI();
if(typeof module!=='undefined')module.exports={generate,DEF,compressWeeks,encodeCP1252};
